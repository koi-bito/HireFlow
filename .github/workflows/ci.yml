name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-eval:
    runs-on: ubuntu-latest
    env:
      GOOGLE_API_KEY: "dummy-ci-test-key"
      HIREFLOW_TEST_MODE: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with Ruff
        run: |
          ruff check .

      - name: Run offline unit & integration tests
        run: |
          pytest -v

      - name: Run CI-safe evaluation harness with regression threshold
        run: |
          python -m evals.run_eval --ci
