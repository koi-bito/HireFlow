services:
  - type: web
    name: hireflow-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MODEL_NAME
        value: gemini-3.5-flash
      - key: MATCHER_MODE
        value: hybrid
      - key: GOOGLE_API_KEY
        sync: false
